<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070612" />
      <stop offset="100%" stop-color="#150d2a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#c084fc" flood-opacity="0.8" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Outer Rounded Container Badge -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="12" stroke-opacity="0.4" />
  
  <!-- Subtle Inner Border -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="#a855f7" stroke-width="3" stroke-opacity="0.3" />

  <!-- Left Bracket < -->
  <path d="M 125 180 L 60 256 L 125 332" fill="none" stroke="url(#cyanGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />
  
  <!-- Slash / -->
  <path d="M 190 168 L 142 344" fill="none" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round" filter="url(#cyanGlow)" />

  <!-- Stylized Center S -->
  <path d="M 312 196 C 312 165 288 150 256 150 C 218 150 196 176 196 208 C 196 270 318 248 318 308 C 318 344 290 362 254 362 C 216 362 192 338 192 308" 
        fill="none" stroke="url(#purpleGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#purpleGlow)" />

  <!-- Right Bracket > -->
  <path d="M 387 180 L 452 256 L 387 332" fill="none" stroke="url(#cyanGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />
</svg>
