<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Day / Night Mode Toggle - Atmospheric Edition</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      background: radial-gradient(120% 90% at 50% 30%, #3f6a97 0%, #123a63 70%);
      transition: background 1.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* NIGHT BACKGROUND */
    body.night {
      background: radial-gradient(120% 90% at 50% 30%, #0a1230 0%, #04050f 75%);
    }

    /* FULLSCREEN STAGE */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
    }

    /* PAGE STARS */
    .page-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .stage.night .page-stars {
      opacity: 1;
    }

    .page-stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.9; }
    }

    /* SHOOTING STARS */
    .shooting-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .stage.night .shooting-stars {
      opacity: 1;
    }

    .shooting {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transform: rotate(-32deg);
      animation: shoot 0.5s linear infinite;
    }

    .shooting::before {
      content: "";
      position: absolute;
      top: 50%;
      right: 0;
      width: 90px;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.9));
    }

    @keyframes shoot {
      0% {
        opacity: 0;
        transform: rotate(-32deg) translateX(0);
      }
      2% {
        opacity: 1;
      }
      12% {
        opacity: 0;
        transform: rotate(-32deg) translateX(-160px);
      }
      100% {
        opacity: 0;
        transform: rotate(-32deg) translateX(-160px);
      }
    }

    /* SHOOTING STARS INSIDE TOGGLE */
    .toggle-shooting-stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      overflow: hidden;
      z-index: 2;
      transition: opacity 1s ease;
    }

    .switch.night .toggle-shooting-stars {
      opacity: 1;
    }

    .toggle-shooting {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transform: rotate(-32deg);
      box-shadow: 0 0 5px rgba(255,255,255,0.9);
      animation: toggleShoot 3.5s linear infinite;
    }

    .toggle-shooting::before {
      content: "";
      position: absolute;
      top: 50%;
      right: 0;
      width: 55px;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.85));
    }

    .toggle-shooting.s1 {
      top: 25%;
      left: 72%;
      animation-delay: 0s;
    }

    .toggle-shooting.s2 {
      top: 48%;
      left: 48%;
      animation-delay: -1.7s;
    }

    .toggle-shooting.s3 {
      top: 18%;
      left: 30%;
      animation-delay: -2.8s;
    }

    @keyframes toggleShoot {
      0% {
        opacity: 0;
        transform: rotate(-32deg) translateX(0);
      }
      5% {
        opacity: 1;
      }
      18% {
        opacity: 0;
        transform: rotate(-32deg) translateX(-75px);
      }
      100% {
        opacity: 0;
        transform: rotate(-32deg) translateX(-75px);
      }
    }

    /* SCENE */
    .scene {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5vh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* LABEL */
    .label {
      position: relative;
      height: 20px;
      width: 240px;
      text-align: center;
    }

    .label span {
      position: absolute;
      left: 0;
      right: 0;
      font-size: 14px;
      letter-spacing: 6px;
      font-weight: 500;
      color: #e9f1fb;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .label span.visible {
      opacity: 0.9;
      transform: translateY(0);
    }

    /* SWITCH BUTTON */
    .switch {
      position: relative;
      width: 78vw;
      max-width: 320px;
      aspect-ratio: 300 / 96;
      border-radius: 48px;
      cursor: pointer;
      padding: 0;
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.35) inset, 0 10px 30px rgba(0,0,0,0.35);
      transition: transform 0.2s ease;
    }

    .switch:active {
      transform: scale(0.98);
    }

    /* TRACK */
    .track {
      position: absolute;
      inset: 0;
      border-radius: 48px;
      overflow: hidden;
      background: linear-gradient(100deg, #a9d3e8 0%, #5e9fd6 100%);
      transition: background 1.1s ease;
    }

    .switch.night .track {
      background: linear-gradient(100deg, #12123f 0%, #2c2f60 100%);
    }

    .track::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0) 40%);
      pointer-events: none;
      z-index: 5;
    }

    /* STARS INSIDE TRACK */
    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }

    .switch.night .stars {
      opacity: 1;
    }

    .stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
    }

    /* MOON */
    .moon {
      position: absolute;
      left: 12%;
      top: 10%;
      width: 9%;
      font-size: 44px;
      aspect-ratio: 1;
      transform: translateY(-50%) rotate(-130deg);
      opacity: 0.35;
      transition: opacity 0.45s ease;
      z-index: 2;
    }

    .switch.night .moon {
      opacity: 1;
    }

    /* SUN */
    .sun {
      position: absolute;
      right: 12%;
      top: 50%;
      width: 13%;
      aspect-ratio: 1;
      transform: translateY(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff6c8, #ffe98a 60%, #f7d55c 100%);
      box-shadow: 0 0 14px 4px rgba(255,233,138,0.8);
      opacity: 1;
      transition: opacity 0.8s ease;
      z-index: 2;
    }

    .switch.night .sun {
      opacity: 0;
    }

    /* BIRDS */
    .birds {
      position: absolute;
      top: 26%;
      left: 0;
      width: 100%;
      height: 20%;
      opacity: 0.9;
      transition: opacity 0.8s ease;
      z-index: 2;
    }

    .switch.night .birds {
      opacity: 0;
    }

    .bird {
      position: absolute;
      top: 0;
      width: 16px;
      height: 9px;
      animation: fly 7s linear infinite;
    }

    .bird svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bird .wing {
      transform-origin: 7px 6px;
      animation: flap 0.5s ease-in-out infinite;
    }

    .bird.b2 {
      animation-delay: -2.3s;
      top: 35%;
    }

    .bird.b2 .wing {
      animation-delay: -0.18s;
    }

    .bird.b3 {
      animation-delay: -4.6s;
      top: 8%;
    }

    .bird.b3 .wing {
      animation-delay: -0.32s;
    }

    @keyframes fly {
      from { left: 75%; }
      to { left: -15%; }
    }

    @keyframes flap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.35); }
    }

    /* CLOUD SYSTEM WITH 2 IMAGES FROM /mood/ */
    .clouds {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4%;
      height: 48%;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .cloud-track {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 200%;
      height: 100%;
      display: flex;
      flex-wrap: nowrap;
      animation: cloudMove 16s linear infinite;
    }

    .cloud-track img {
      flex: 0 0 25%;
      width: 28%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center bottom;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      transform: scale(1.12);
      margin-left: -2.5%;
      margin-right: -2.5%;
    }

    @keyframes cloudMove {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* KNOB */
    .knob {
      position: absolute;
      top: 8%;
      left: 2.5%;
      width: 27%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #fffdf5 0%, #fed766 65%, #f59e0b 100%);
      box-shadow: 
        0 2px 6px rgba(0, 0, 0, 0.35),
        0 0 8px 1px rgba(245, 158, 11, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.7);
      transition: 
        left 0.65s cubic-bezier(0.65, -0.1, 0.25, 1.15), 
        background 0.6s ease,
        box-shadow 0.6s ease;
      z-index: 6;
    }

    .switch.night .knob {
      background: radial-gradient(circle at 35% 32%, #cbd5e1 0%, #94a3b8 55%, #64748b 100%);
      box-shadow: 
        0 2px 6px rgba(0, 0, 0, 0.5),
        0 0 8px 1px rgba(148, 163, 184, 0.3),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }

    .switch.on .knob {
      left: 70.5%;
    }

    /* REFLECTION */
    .reflection {
      width: 78vw;
      max-width: 320px;
      aspect-ratio: 300 / 96;
      margin-top: -0.5vh;
      pointer-events: none;
      transform: scaleY(-1);
      filter: blur(2px);
      opacity: 0.3;
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0) 75%);
      mask-image: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0) 75%);
    }

    .reflection .track,
    .reflection .switch {
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <!-- PAGE STARS -->
    <div class="page-stars" id="pageStars"></div>

    <!-- SHOOTING STARS -->
    <div class="shooting-stars">
      <div
        class="shooting"
        style="top:14%; left:70%; animation-duration:5.5s; animation-delay:.2s;"
      ></div>
      <div
        class="shooting"
        style="top:26%; left:40%; animation-duration:8s; animation-delay:.5s;"
      ></div>
      <div
        class="shooting"
        style="top:8%; left:85%; animation-duration:7s; animation-delay:.8s;"
      ></div>
    </div>

    <!-- MAIN SCENE -->
    <div class="scene">
      <!-- LABEL -->
      <div class="label">
        <span id="labelDay" class="visible">Day Mode</span>
        <span id="labelNight">Night Mode</span>
      </div>

      <!-- MAIN TOGGLE BUTTON -->
      <button
        class="switch"
        id="switchBtn"
        aria-pressed="false"
        aria-label="Toggle day and night mode"
      >
        <div class="track">
          <!-- TRACK STARS -->
          <div class="stars" id="trackStars"></div>

          <!-- TOGGLE SHOOTING STARS -->
          <div class="toggle-shooting-stars">
            <span class="toggle-shooting s1"></span>
            <span class="toggle-shooting s2"></span>
            <span class="toggle-shooting s3"></span>
          </div>

          <!-- MOON -->
          <div class="moon">🌙</div>

          <!-- SUN -->
          <div class="sun"></div>

          <!-- FLYING BIRDS -->
          <div class="birds">
            <svg class="bird b1" viewBox="0 0 14 8" aria-hidden="true">
              <path class="wing" d="M0 6 Q7 -2 14 6 Q7 3 0 6Z" fill="#eef6ff" />
            </svg>
            <svg class="bird b2" viewBox="0 0 14 8" aria-hidden="true">
              <path class="wing" d="M0 6 Q7 -2 14 6 Q7 3 0 6Z" fill="#eef6ff" />
            </svg>
            <svg class="bird b3" viewBox="0 0 14 8" aria-hidden="true">
              <path class="wing" d="M0 6 Q7 -2 14 6 Q7 3 0 6Z" fill="#eef6ff" />
            </svg>
          </div>

          <!-- MOVING CLOUD TRACK (USING IMAGES FROM public/mood/) -->
          <div class="clouds">
            <div class="cloud-track">
              <img src="/mood/cloud2.png" alt="" aria-hidden="true" draggable="false" />
              <img src="/mood/cloud.png" alt="" aria-hidden="true" draggable="false" />
              <img src="/mood/cloud2.png" alt="" aria-hidden="true" draggable="false" />
              <img src="/mood/cloud.png" alt="" aria-hidden="true" draggable="false" />
            </div>
          </div>
        </div>

        <!-- KNOB -->
        <div class="knob"></div>
      </button>

      <!-- REFLECTION -->
      <div class="switch reflection" id="reflectionEl" aria-hidden="true">
        <div class="track">
          <!-- REFLECTION STARS -->
          <div class="stars" id="reflectionStars"></div>

          <!-- REFLECTION MOON -->
          <div class="moon">🌙</div>

          <!-- REFLECTION SUN -->
          <div class="sun"></div>

          <!-- REFLECTION CLOUD TRACK -->
          <div class="clouds">
            <div class="cloud-track">
              <img src="/mood/cloud.png" alt="" aria-hidden="true" draggable="false" />
              <img src="/mood/cloud2.png" alt="" aria-hidden="true" draggable="false" />
              <img src="/mood/cloud.png" alt="" aria-hidden="true" draggable="false" />
              <img src="/mood/cloud2.png" alt="" aria-hidden="true" draggable="false" />
            </div>
          </div>
        </div>

        <!-- REFLECTION KNOB -->
        <div class="knob"></div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const btn = document.getElementById('switchBtn');
    const reflection = document.getElementById('reflectionEl');
    const labelDay = document.getElementById('labelDay');
    const labelNight = document.getElementById('labelNight');

    let isNight = false;

    /* RANDOM STARS GENERATOR */
    function randomDots(container, count) {
      if (!container) return;
      let html = '';
      for (let i = 0; i < count; i++) {
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const delay = (Math.random() * 3).toFixed(2);
        html += `<span style="left:${x}%; top:${y}%; animation-delay:${delay}s;"></span>`;
      }
      container.innerHTML = html;
    }

    /* POPULATE STARS */
    randomDots(document.getElementById('pageStars'), 50);
    randomDots(document.getElementById('trackStars'), 14);
    randomDots(document.getElementById('reflectionStars'), 14);

    /* DAY / NIGHT STATE HANDLER */
    function setState(night) {
      isNight = night;

      document.body.classList.toggle('night', night);
      stage.classList.toggle('night', night);

      btn.classList.toggle('night', night);
      btn.classList.toggle('on', night);

      reflection.classList.toggle('night', night);
      reflection.classList.toggle('on', night);

      btn.setAttribute('aria-pressed', night ? 'true' : 'false');

      labelDay.classList.toggle('visible', !night);
      labelNight.classList.toggle('visible', night);
    }

    /* CLICK EVENT */
    btn.addEventListener('click', () => {
      setState(!isNight);
    });

    /* KEYBOARD ACCESSIBILITY */
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setState(!isNight);
      }
    });
  </script>
</body>
</html>
